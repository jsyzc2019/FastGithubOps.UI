name: Build FastGithub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore FastGithub.sln

    - name: Build
      run: dotnet build FastGithub.sln --no-restore --configuration Release

    # 说明：本解决方案当前不含任何测试工程（8 个工程均为产品工程），
    # `dotnet test` 在找不到测试项目时返回退出码 1 会使 job 失败，
    # 因此不执行。将来补充测试工程后再把该步骤加回来。

  build-multi-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact-name: fastgithub-linux-x64
          - os: windows-latest
            runtime: win-x64
            artifact-name: fastgithub-win-x64
          - os: macos-latest
            runtime: osx-x64
            artifact-name: fastgithub-osx-x64

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build for ${{ matrix.os }}
      run: |
        dotnet restore FastGithub.sln
        dotnet build FastGithub.sln --configuration Release

    - name: Publish single-file artifacts with UI
      shell: bash
      run: |
        # 发布主程序
        # 注意：不要加 -p:PublishTrimmed=true。YARP/ASP.NET Core 依赖运行时反射，
        # 裁剪后会在运行期抛 MissingMethod/TypeLoadException；
        # 已验证的产物（v2.4.0 win-x64）同样未经裁剪，保持一致。
        dotnet publish FastGithub/FastGithub.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o ./publish/${{ matrix.runtime }}

        # 发布 UI (仅 Windows)
        if [ "${{ matrix.runtime }}" == "win-x64" ]; then
          dotnet publish FastGithub.UI/FastGithub.UI.csproj \
            -c Release \
            -o ./publish/${{ matrix.runtime }}
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ./publish/${{ matrix.runtime }}
