name: Build FastGithub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 当前阶段只维护 win-x64：主程序依赖 WinDivert 做透明拦截，
    # UI 是 net45 WPF，两者都只能在 Windows 上构建。
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 【v2.6.11】仓库的 NuGet.config 只配了华为云镜像（本机 restore 用），
    # 该镜像在 GitHub runner 上 nupkg 下载损坏（"End of Central Directory"），
    # 是 2026-10 全部 26 次 CI 失败的唯一根因。CI 内临时覆盖为 nuget.org，
    # 只影响 runner 工作区，不改仓库文件。
    - name: Use nuget.org feed (Huawei mirror is broken on runners)
      shell: bash
      run: |
        cat > NuGet.config << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
          </packageSources>
        </configuration>
        EOF

    - name: Restore dependencies
      run: dotnet restore FastGithub.sln

    - name: Build
      run: dotnet build FastGithub.sln --no-restore --configuration Release

    # 说明：本解决方案不含 xunit/nunit 测试工程，`dotnet test` 会因找不到测试而失败。
    # 逻辑正确性由 --SelfTest 内置自检承担（13+ 条健康度/熔断断言），见下方冒烟步骤。

  publish-win-x64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Use nuget.org feed (Huawei mirror is broken on runners)
      shell: bash
      run: |
        cat > NuGet.config << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
          </packageSources>
        </configuration>
        EOF

    - name: Publish main program
      # 不要加 -p:PublishTrimmed=true。YARP/ASP.NET Core 依赖运行时反射，
      # 裁剪后会在运行期抛 MissingMethod/TypeLoadException。
      run: |
        dotnet publish FastGithub/FastGithub.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -o ./publish/win-x64

    - name: Publish UI into the same directory
      # 必须与主程序输出到同一目录。UI 运行时按同目录查找 fastgithub.exe，
      # 分目录发布会导致 UI 及其 .config 在打包时被整体漏掉（v2.4.1 的实际问题）。
      run: |
        dotnet publish FastGithub.UI/FastGithub.UI.csproj `
          -c Release `
          -o ./publish/win-x64

    # 冒烟自检：--SelfTest 跑健康度跟踪/DoH熔断等 13+ 条纯逻辑断言，
    # 不需要管理员权限与真实网络。首次接入先 continue-on-error，
    # 观察几轮稳定后再改为阻塞步骤。
    - name: Self test (smoke)
      continue-on-error: true
      run: dotnet publish/win-x64/fastgithub.dll --SelfTest

    - name: Verify published files
      # 发布后立刻校验关键文件齐全，避免再次产出缺文件的包
      shell: bash
      run: |
        set -euo pipefail
        cd ./publish/win-x64
        missing=0
        for f in fastgithub.exe FastGithub.UI.exe FastGithub.UI.exe.config appsettings.json; do
          if [ ! -f "$f" ]; then
            echo "::error::缺少发布文件: $f"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi
        echo "发布文件校验通过"
        ls -la

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fastgithub-win-x64
        path: ./publish/win-x64
